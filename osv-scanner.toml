# Advisories osv-scanner may ignore in uv.lock. Each entry must carry an
# ignoreUntil date so a waiver lapses on its own and the scan fails again.
# Use one only while no release the lock can resolve fixes the advisory, for
# example when the fix sits outside a version pin in pyproject.toml; bump the
# lock once a fix becomes reachable.
