#
# Simulator-comparison configuration; experiments/simulator_comparison/config.py
# describes every field. Paths are relative to the repository root; services
# and GPUs come from .env, as for any user of the library.
#
# Twin of pilot.yaml that differs only in horizons and its results files: its
# JointFM next day comes from a next-day-only request instead of the
# multi-horizon one, so the two reports show whether querying more horizons
# changes JointFM's next-step forecast.

prices: data/stock_data/sp500.csv
output: results/simulator_comparison/pilot_next_day.parquet
trials: 20
origins: 2
assets: 100
look_back: 252
origin_history: 731
forward: 63
num_scen: 10000
seed: 0
# jointfm runs on the device of the service .env selects; run the config again
# with .env pointing at the other device's service to add that JointFM arm.
# The swap arms and window-independent read their donors' scenarios.
arms: [no_fit-cpu, gaussian-cpu, kde-gpu, jointfm, swap-jointfm-window, swap-window-jointfm, swap-window-window, window-independent]
portfolio_sizes: [1, 2, 5, 10, 25, 50, 100]
horizons: [1]
# Rebalancing backtest of the same trials' universes (task experiments:rebalance).
rebalancing:
  output: results/simulator_comparison/pilot_next_day_rebalancing.parquet
  arms: [no_fit-cpu, gaussian-cpu, kde-gpu, jointfm, swap-jointfm-window, swap-window-jointfm, swap-window-window, jointfm-historical, window-independent]
  trials: 20
  trading_days: 378
  look_forward_window: 21
  # Calendar days, as rebalance_portfolio counts the look-back window.
  look_back_days: 365
  trigger: every_step
  pct_change_threshold: -0.005
  transaction_cost: 0.001
  risk_free_rates: data/rates/dtb3.csv
  solver: CUOPT
  cvar:
    w_min: -0.3
    w_max: 0.8
    c_min: 0.1
    c_max: 0.2
    L_tar: 1.6
    T_tar: 0.5
    confidence: 0.95
    risk_aversion: 1.0
